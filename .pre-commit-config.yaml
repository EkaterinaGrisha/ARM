# Hooks run the tools pinned in uv.lock, so local checks match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: import-linter
        name: import boundaries of the core (ADR-0011)
        entry: uv run lint-imports
        language: system
        types_or: [python, toml]
        pass_filenames: false
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|backend/pyproject\.toml|packages/kdcheck/pyproject\.toml|synth/pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: requirements
        name: backend/requirements.txt matches uv.lock
        entry: sh scripts/export_requirements.sh
        language: system
        files: ^(uv\.lock|backend/requirements\.txt)$
        pass_filenames: false
      - id: report-schema
        name: report JSON Schema and web types match kdcheck.schemas
        entry: sh scripts/export_schema.sh
        language: system
        files: ^(packages/kdcheck/src/kdcheck/schemas/.*|docs/report\.schema\.json|frontend/scripts/report-types\.mjs|frontend/src/api/report\.generated\.ts)$
        pass_filenames: false
