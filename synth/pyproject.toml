[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synth"
version = "0.1.0"
description = "Synthetic design documentation (ESKD) with ground truth: the demo kit generator"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  # BSD-3-Clause or Apache-2.0; renders the scans
  "pypdfium2>=5.14",
  # BSD
  "reportlab>=5.0",
]

[tool.setuptools.package-data]
synth = ["fonts/*"]
