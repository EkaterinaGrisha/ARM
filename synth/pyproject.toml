[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synth"
version = "0.1.0"
description = "Synthetic design documentation (ESKD) with ground truth: the demo kit and the kit generators"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  # MIT; the ground truth models (ADR-0013)
  "pydantic>=2.6",
  # BSD-3-Clause or Apache-2.0; renders the scans
  "pypdfium2>=5.14",
  # BSD
  "reportlab>=5.0",
]

[dependency-groups]
# MIT; scans of the stress corpus (synth.augraphy_scans, ADR-0013). The default pipeline calls random.randint with
# floats, which Python 3.12 rejects, so the group installs on 3.11 only: uv run --group augraphy …
augraphy = ["augraphy==8.2.6 ; python_full_version < '3.12'"]

[tool.setuptools.package-data]
synth = ["fonts/*"]
