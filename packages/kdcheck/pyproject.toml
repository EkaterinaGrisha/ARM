[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdcheck"
version = "0.1.0"
description = "Batch completeness check and analysis of design documentation (ESKD): core library and CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[tool.setuptools.package-data]
kdcheck = ["py.typed"]
