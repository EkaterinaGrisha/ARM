[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdcheck"
version = "0.1.0"
description = "Batch completeness check and analysis of design documentation (ESKD): core library and CLI"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# AGPL-3.0, only behind kdcheck.ingest.pdf.PdfBackend (ADR-0007)
pymupdf = ["pymupdf>=1.24"]
ocr = ["pytesseract>=0.3.10"]

[tool.setuptools.package-data]
kdcheck = ["py.typed"]
