[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdcheck"
version = "0.1.0"
description = "Batch completeness check and analysis of design documentation (ESKD): core library and CLI"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pillow>=10.0",
  "pydantic>=2.6",
  # The default PDF backend (ADR-0007). BSD-3-Clause or Apache-2.0; PDFium itself is BSD-3-Clause
  "pypdfium2>=5.14",
  # configs/*.yaml (ADR-0012). MIT
  "pyyaml>=6.0",
]

[project.scripts]
kdcheck = "kdcheck.cli:main"

[project.optional-dependencies]
# AGPL-3.0: only behind kdcheck.ingest.pdf.PdfBackend, for a rollback with ARM_PDF_BACKEND=pymupdf (ADR-0007)
pymupdf = ["pymupdf>=1.24"]
ocr = ["pytesseract>=0.3.10"]
# The PP-OCRv5 recognizer of cells on the CPU (ADR-0024): onnxruntime MIT, numpy BSD-3-Clause. The model files come
# from scripts/fetch_ppocr.sh
ppocr = ["numpy>=1.26", "onnxruntime>=1.20"]

[tool.setuptools.package-data]
kdcheck = ["py.typed"]
