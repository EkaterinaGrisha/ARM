name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an older run of the same PR. Pushes to main get one group per commit:
  # a shared group would still drop pending runs, so some commits would never be checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One macOS job is enough to catch OS-specific behaviour; macOS runners queue longer.
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install a Cyrillic font for the demo kit generator test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -ra
      - name: backend/requirements.txt matches uv.lock
        run: sh scripts/export_requirements.sh && git diff --exit-code backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arm-kd .
      - name: The image serves the API and the web UI
        run: |
          docker run -d --name arm-kd -p 8000:8000 arm-kd
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
      - name: The image has the kdcheck command
        run: docker run --rm arm-kd kdcheck run --help
      - if: failure()
        run: docker logs arm-kd
