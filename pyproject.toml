[tool.uv.workspace]
members = ["backend", "packages/kdcheck", "synth"]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "import-linter>=2.15",
  "mypy>=1.13",
  "pip-licenses>=5.5",
  "pre-commit>=4",
  "pytest>=8",
  # test PDFs: text, rotation, passwords and scans without PyMuPDF
  "reportlab>=5.0",
  "ruff>=0.8",
  "types-openpyxl",
  "types-pyyaml",
  "types-reportlab",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through call defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["backend/arm_web", "packages/kdcheck/src/kdcheck", "synth/src/synth"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pymupdf", "pymupdf.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# The core is strict. `strict = true` in an override leaks to every module, so its flags are listed one by one.
module = ["kdcheck", "kdcheck.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# The PyMuPDF adapter is the only place that calls the untyped library.
module = ["kdcheck.ingest.pymupdf_backend"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "packages/kdcheck/tests", "synth/tests"]

# Import boundaries of the core (ADR-0010, ADR-0011). Run: uv run lint-imports
[tool.importlinter]
root_packages = ["kdcheck", "arm_web", "synth"]

[[tool.importlinter.contracts]]
name = "The API imports only the public core modules: schemas, run, render, report"
type = "forbidden"
source_modules = ["arm_web"]
forbidden_modules = [
  "kdcheck.config",
  "kdcheck.ingest",
  "kdcheck.ocr",
  "kdcheck.extract",
  "kdcheck.normalize",
  "kdcheck.checks",
  "kdcheck.params",
  "kdcheck.pipeline",
]
# The public modules use the internals; only direct imports from the API are forbidden.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Block 1 (checks) and Block 2 (params) do not import each other"
type = "independence"
modules = ["kdcheck.checks", "kdcheck.params"]

[[tool.importlinter.contracts]]
name = "The report contract depends on no other core module"
type = "forbidden"
source_modules = ["kdcheck.schemas"]
forbidden_modules = [
  "kdcheck.ingest",
  "kdcheck.ocr",
  "kdcheck.extract",
  "kdcheck.normalize",
  "kdcheck.checks",
  "kdcheck.params",
  "kdcheck.pipeline",
  "kdcheck.report",
  "kdcheck.render",
  "kdcheck.run",
  "kdcheck.cli",
]

[[tool.importlinter.contracts]]
name = "The test data generator does not use the code under test"
type = "forbidden"
source_modules = ["synth"]
forbidden_modules = ["kdcheck", "arm_web"]

[[tool.importlinter.contracts]]
name = "The core and the API do not import the generator, which is not installed with them"
type = "forbidden"
source_modules = ["kdcheck", "arm_web"]
forbidden_modules = ["synth"]
