[tool.uv.workspace]
members = ["backend", "packages/kdcheck"]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
  "types-openpyxl",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through call defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["backend/arm_web", "packages/kdcheck/src/kdcheck"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# The core is strict. `strict = true` in an override leaks to every module, so its flags are listed one by one.
module = ["kdcheck", "kdcheck.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "packages/kdcheck/tests"]
