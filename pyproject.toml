[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
  "types-openpyxl",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters through call defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["backend/arm_web"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true

