# Block 1: the completeness rules. Their logic, texts and tests are in kdcheck.checks; here each rule is turned on
# or off and gets the severity of the discrepancies it reports: high, medium or low.

rules:
  B1.MISSING.001: {enabled: true, severity: high}    # a part named in a specification has no drawing in the kit
  B1.MISSING.002: {enabled: true, severity: high}    # a document of the «Документация» section is not in the kit
  B1.SPEC.001: {enabled: true, severity: high}       # an assembly has no specification of its own
  B1.ORPHAN.001: {enabled: true, severity: medium}   # a document of the kit is in no specification
  B1.NAME.001: {enabled: true, severity: medium}     # the name on a drawing differs from the specification
  B1.NAME.002: {enabled: true, severity: medium}     # the own specification of an assembly names it differently
  B1.DUP.001: {enabled: true, severity: high}        # one designation on several documents
  B1.DUP.002: {enabled: true, severity: high}        # one designation on positions with different names
  B1.DUP.003: {enabled: true, severity: high}        # one designation on several specifications
  B1.VERSION.001: {enabled: true, severity: medium}  # copies of a document differ in change number or litera
  B1.LITERA.001: {enabled: true, severity: medium}   # a specification and its assembly drawing differ in litera
  B1.LITERA.002: {enabled: true, severity: medium}   # a component has a lower litera than its assembly (GOST 2.103)
  B1.SHEETS.001: {enabled: true, severity: high}     # a document has fewer sheets than its title block counts (ADR-0017)
  B1.FORMAT.001: {enabled: true, severity: low}      # the format column names another format than the document has
  B1.SECTION.001: {enabled: true, severity: medium}  # an assembly in «Детали», or a part in «Сборочные единицы»
  B1.POS.001: {enabled: true, severity: medium}      # one position number on several rows of a specification
  B1.POS.002: {enabled: true, severity: medium}      # a component row of a specification without a quantity
  B1.POS.003: {enabled: true, severity: medium}      # a position of an assembly or a part without a designation
  B1.FIRSTUSE.001: {enabled: true, severity: low}    # «Перв. примен.» names an assembly of the kit that does not list it

sheets:                          # B1.SHEETS.001 (ADR-0017)
  count_methods: [text_layer]    # «Листов» read this way counts the sheets of a document; OCR reads the 1 of the GOST
                                 # lettering as 7, so without it a document is short of sheets only by a gap in their numbers

positions:                       # B1.POS.001–B1.POS.003 (ADR-0027)
  methods: [text_layer]          # rows read this way are checked: OCR reads the 1 of the GOST lettering as 7 and
                                 # loses a narrow quantity cell, and a misread is no anomaly of the specification.
                                 # A gap in the numbers is none either: GOST 2.106 lets positions be reserved

preliminary:                     # a finding that an unread document may explain (ADR-0027)
  listed: 5                      # files its message names; document_ids holds every one

names:                           # a misread letter is not another name
  methods: [ocr, vlm]            # when either of two names was read this way they may differ a little
  min_similarity: 0.75           # 0–1, the share of letters in common: at this or more they are one name. Names of as
                                 # many words are compared word by word, so «правый» and «левый» stay two names
