# Engines that read documents (ADR-0007, ADR-0012). The report lists the engines and versions that produced it.

pdf:
  backend: pdfium                # pdfium; pymupdf (AGPL-3.0) only for a rollback. ARM_PDF_BACKEND overrides

ocr:
  engine: tesseract
  enabled: true                  # --no-ocr and ARM_OCR=0 turn it off
  languages: rus+eng
  page_segmentation: 11          # Tesseract --psm: sparse text in any order
  min_word_confidence: 30        # 0–100: words recognized with less are dropped
  cells:                         # cells of a title block and a specification table found by their ruled lines
    engine: ppocr                # ppocr — the PP-OCRv5 recognizer below (ADR-0024); tesseract — Tesseract with the
                                 # settings below. Without the files of ppocr or onnxruntime the cells are read by
                                 # Tesseract, and the run log says so
    languages: rus               # Cyrillic, digits and signs; with eng the GOST lettering of «ПМЛС» reads «HMAC»
    page_segmentation: 6         # Tesseract --psm: a block of text, one or two lines
    text_height: 40              # px: the tallest line of text in a cell is resized to this before recognition
    text_range: [1.5, 12]        # mm: a run of ink rows this high is a line of text; GOST 2.304 sizes start at 1.8
    pixels_per_mm: 12            # a cell without one is resized to this, about 300 dpi
    margin: 0.5                  # mm: a cell is read this far inside its ruled lines
    min_ink: 0.5                 # mm² of ink below which a cell is empty and not read: less than one digit
    min_word_confidence: 0       # 0–100: all words of a cell with ink are kept, their confidence goes to the report
    characters:                  # what a cell may hold: Tesseract reads only these characters there, so the С of the
                                 # GOST lettering is not read «(» and its 1 is not read «/»; elsewhere it costs more.
                                 # PP-OCRv5 reads only these too, a Latin lookalike counting for its Cyrillic letter
      designation: АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ0123456789.-  # GOST 2.201
      changes: "0123456789"
      material: АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789.,-/
  ppocr:                         # the PP-OCRv5 text line recognizer for East Slavic languages (ADR-0024), Apache-2.0:
                                 # 8 MB, about 4 ms a cell on the CPU through onnxruntime. scripts/fetch_ppocr.sh takes
                                 # the files of the revision from Hugging Face, checks them and makes models/ppocr
    model: eslav_PP-OCRv5_mobile_rec
    repository: PaddlePaddle/eslav_PP-OCRv5_mobile_rec
    revision: 7553801264d3379d8d2e854971989e5e26c22e03
    sha256:
      inference.json: 3fb6e2e658f5139ff16e35260de8f0577f106a9505c902e1dfc1f4f1d03cc9cb
      inference.pdiparams: f11057b05d8517868bca505271278973d706600d9dcc184cbcf5c4512091c32b
      inference.yml: 025039bac23eb4a308efcefa4d58eab3af440767815c6ba6938468bf6353ee5a
    height: 48                   # px: the recognizer reads a line this high
    valley: 0.15                 # of the ink of the median row with ink: the rows between two lines of a cell
                                 # hold less, though a descender of one touches the other
    speck_gap: 1.5               # line heights: ink this far from the rest of its line and lighter than min_ink is a
                                 # speck, not a character
    margin: 0.2                  # of the line height: paper kept around a line cut to its ink. With all the paper of
                                 # the cell the recognizer drops characters even of a clean print: «МАШН.7.002»

vlm:                             # a vision-language model reads title block cells (ADR-0014); off by default
  enabled: false                 # ARM_VLM=1 or kdcheck run --vlm turn it on
  base_url: http://127.0.0.1:1234/v1  # an OpenAI-compatible server: LM Studio, llama.cpp, Ollama, vLLM. ARM_VLM_URL overrides
  model: qwen3.6-35b-a3b-mlx     # the model id on that server; ARM_VLM_MODEL overrides. Qwen3.6-35B-A3B, the 4-bit MLX
                                 # build measured in the model report; another build of it has an id of its own
  allow_remote: false            # a server on another machine gets the customer's documents: only with ARM's consent
  prompt: title_block_cell.v1    # prompts/<name>.txt; a changed prompt is a new file with a new version
  methods: [ocr]                 # pages read this way get their title block cells read by the model too
  verify: true                   # false: only the cells OCR left empty; true: every cell, and a different value is a conflict
  conflict: model                # whose reading a conflict keeps (ADR-0019): model — the model's, ocr — the one read before;
                                 # the other goes to the notes of the document
  fields:                        # the cells the model reads, as the prompt names them
    designation: Обозначение документа
    name: Наименование изделия
    material: Материал
    mass: Масса
    scale: Масштаб
    litera: Литера
  rows:                          # cells of specification rows of rasters and scans the model reads too (ADR-0021)
    prompt: spec_row_cell.v1
    fields:
      designation: Обозначение
      name: Наименование
  requirements:                  # the technical requirements block of rasters and scans the model reads too (ADR-0023)
    prompt: tech_requirements.v1
    max_tokens: 2048             # several items, line by line; the cells take less
    target_dpi: 300              # a coarser image is enlarged to this, as the bench cut its blocks
    pad_mm: 2                    # around the lines OCR found above the title block
    line_match: 0.4              # a line of the answer this alike to a row of OCR gets its place on the sheet, so an item
                                 # has the rows of its lines as evidence; an item none of whose lines is alike, the block
  timeout_sec: 120               # one cell; a model on a laptop may take a while to load and answer
  max_tokens: 512                # the answer is JSON {"text": …}; a reasoning model may spend tokens before it
  seed: 7                        # repeatable answers from the same server and model
