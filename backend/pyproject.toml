[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-web"
version = "0.1.0"
description = "Проверка комплектности и анализ конструкторской документации: API, конвейер обработки, веб-интерфейс"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "kdcheck",
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "openpyxl>=3.1",
]

[tool.uv.sources]
kdcheck = { workspace = true }

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[tool.setuptools.packages.find]
include = ["arm_web*"]
